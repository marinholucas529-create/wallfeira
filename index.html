<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<title>Contact / 联系方式</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M10 7h4l2 5-2.5 1.5a11 11 0 0 0 5 5L20 16l5 2v4a3 3 0 0 1-3 3A16 16 0 0 1 7 10a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:#fff;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.3;
  min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 20px max(14px,env(safe-area-inset-bottom));
}
main{width:100%;max-width:440px}
.brand{margin-bottom:clamp(10px,2.6vh,22px)}
.brand img{display:block;width:min(230px,64%);height:auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;padding-bottom:8px;border-bottom:3px solid #111}
h1 span,.label span{font-weight:400}
section{padding:clamp(7px,1.6vh,14px) 0;border-bottom:1px solid #d4d4d4}
section:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.label{font-size:15px;color:#444;margin-bottom:1px}
.value{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.phone{font-variant-numeric:tabular-nums;white-space:nowrap}
.link{color:#111;font-size:20px;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;overflow-wrap:anywhere}
.cols{display:flex;gap:28px;flex-wrap:wrap}
.country{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.flag{display:inline-flex;align-items:center;gap:8px}
.flag img{width:40px;height:28px;flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.icon-btn{
  flex:none;width:50px;height:50px;display:flex;align-items:center;justify-content:center;
  background:#fff;color:#111;border:2px solid #111;border-radius:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{background:#f0f0f0}
.icon-btn.ok{border-color:#0a7a32;color:#0a7a32;background:#eef8f1}
@media (max-height:680px){
  .brand img{width:min(190px,54%)}
  h1{font-size:23px;padding-bottom:6px}
  section{padding:6px 0}
  .value{font-size:21px}.link{font-size:19px}
  .icon-btn{width:46px;height:46px}
}
@media (max-height:540px), (max-width:340px){
  body{padding:10px 16px}
  .brand{margin-bottom:8px}.brand img{width:min(150px,46%)}
  h1{font-size:20px;padding-bottom:5px}
  section{padding:4px 0}
  .label{font-size:13px;margin-bottom:0}
  .value{font-size:19px}.link{font-size:17px}
  .flag img{width:34px;height:24px}
  .icon-btn{width:42px;height:42px}.icon-btn svg{width:20px;height:20px}
}
</style>
</head>
<body>
<main>
  <header class="brand"><img src="logo-wall-gear.png" width="678" height="214" alt="Wall Gear"></header>
  <h1>Contact <span>/ <span lang="zh-Hans">联系方式</span></span></h1>

  <!-- Personal phone: para ocultar, apague esta seção inteira -->
  <section class="row">
    <div class="grow">
      <p class="label">Personal phone / <span lang="zh-Hans">个人电话</span></p>
      <p class="value phone">+55 11 98182-3988</p>
    </div>
    <a class="icon-btn" href="tel:+5511981823988" aria-label="Call / 拨打"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
    <button class="icon-btn copy" type="button" data-copy="+5511981823988" aria-label="Copy / 复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  </section>

  <section class="row">
    <div class="grow">
      <p class="label">Business phone / <span lang="zh-Hans">商务电话</span></p>
      <p class="value phone">+55 11 97398-3388</p>
    </div>
    <a class="icon-btn" href="tel:+5511973983388" aria-label="Call / 拨打"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
    <button class="icon-btn copy" type="button" data-copy="+5511973983388" aria-label="Copy / 复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  </section>

  <section class="row">
    <div class="grow">
      <p class="label">Email / <span lang="zh-Hans">邮箱</span></p>
      <a class="link" href="mailto:contatos@wallgear.com.br">contatos@wallgear.com.br</a>
    </div>
    <button class="icon-btn copy" type="button" data-copy="contatos@wallgear.com.br" aria-label="Copy / 复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  </section>

  <section class="cols">
    <div>
      <p class="label">Instagram</p>
      <a class="link" href="https://www.instagram.com/wall.gear/">@wall.gear</a>
    </div>
    <div>
      <p class="label">Website / <span lang="zh-Hans">网站</span></p>
      <a class="link" href="https://wallgear.com.br">wallgear.com.br</a>
    </div>
  </section>

  <section>
    <p class="label">City / <span lang="zh-Hans">城市</span></p>
    <p class="value country">São Paulo <span class="flag"><img src="brasil.svg" width="40" height="28" alt=""><span>Brazil / <span lang="zh-Hans">巴西</span></span></span></p>
  </section>

  <section>
    <p class="label">Address / <span lang="zh-Hans">地址</span></p>
    <p class="value">R. Rio Bonito, 605</p>
  </section>
</main>
<script>
(function(){
  function fallback(txt){
    var t=document.createElement('textarea');
    t.value=txt;t.setAttribute('readonly','');
    t.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);t.select();t.setSelectionRange(0,99);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(t);return ok;
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('.copy');if(!b)return;
    var txt=b.getAttribute('data-copy');
    function done(ok){
      if(!ok){window.prompt('Copy / 复制',txt);return}
      b.classList.add('ok');
      setTimeout(function(){b.classList.remove('ok')},2000);
    }
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(fallback(txt))});
    }else done(fallback(txt));
  });
})();
</script>
</body>
</html>
